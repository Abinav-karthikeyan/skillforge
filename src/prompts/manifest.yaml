# skill-forge prompt manifest
# Each mode declares its active version and all available versions.
#
# Override precedence (highest first):
#   1. --prompt-version CLI flag / prompt_version MCP arg
#   2. SKILL_FORGE_PROMPT_VERSION env var (global "v2" or per-mode "interview-qa@v2")
#   3. active field below
#
# To add a new version: create <mode>/v<N>.txt and add it here.

interview-qa:
  active: v2
  versions:
    v1:
      notes: "Initial STAR-format prompt with calibration hints"
      tuned_against: "claude-sonnet-4-6"
    v2:
      notes: "Adds optional focus-brief slot for orchestrator-driven subagent guidance"
      tuned_against: "claude-sonnet-4-6"

