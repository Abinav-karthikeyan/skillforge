# Career Mode configuration
# Copy this file to your project root or ~/.career-mode/config.yaml

experience_level: senior       # junior | mid | senior | staff
tone: balanced                 # technical | business | balanced
output_dir: ~/.career-mode/artifacts

# LLM provider — the recommended path is `openai-compatible`, which works with
# any endpoint that speaks the OpenAI Chat Completions API (DeepSeek, Groq,
# Together, Fireworks, xAI, LM Studio, vLLM, Ollama, and OpenAI itself).
#
# The api_key field supports ${VAR} indirection — put the actual key in a .env
# file (project root or ~/.career-mode/.env, both gitignored) and reference the
# env var here. This keeps secrets out of the yaml.

# ── DeepSeek (recommended for cost/quality) ───────────────────────────────────
provider: openai-compatible
model: deepseek-chat                    # or deepseek-reasoner
base_url: https://api.deepseek.com/v1
api_key: ${DEEPSEEK_API_KEY}            # put DEEPSEEK_API_KEY=sk-... in .env

# ── Other openai-compatible providers ─────────────────────────────────────────
# provider: openai-compatible
# model: llama-3.3-70b-versatile
# base_url: https://api.groq.com/openai/v1
# api_key: ${GROQ_API_KEY}
#
# provider: openai-compatible
# model: gpt-4o-mini
# base_url: https://api.openai.com/v1
# api_key: ${OPENAI_API_KEY}
#
# ── Ollama (local, no key needed) ─────────────────────────────────────────────
# provider: ollama
# model: qwen2.5
# base_url: http://localhost:11434/v1
#
# ── Anthropic (native SDK, not openai-compatible) ─────────────────────────────
# provider: anthropic
# model: claude-sonnet-4-6
# api_key: ${ANTHROPIC_API_KEY}
#
# Auto-detection (only kicks in when `provider` is unset above):
#   ANTHROPIC_API_KEY set → anthropic
#   OPENAI_API_KEY set    → openai (base_url defaults to api.openai.com)
#   neither               → ollama (http://localhost:11434)

# Optional
# target_role: Staff Engineer
# company_size: startup                 # startup | mid | enterprise
# default_mode: portfolio-bullet

# Custom instructions — injected into every translator system prompt.
# Use this to give Career Mode context it can't infer from git alone:
# who you're interviewing with, what to emphasize, tone adjustments.
#
# Flat string (applies to all modes):
# custom_instructions: >
#   I'm targeting Staff Engineer roles at fintech companies (Stripe, Square, Plaid).
#   Emphasize reliability, distributed systems, and compliance/security angles.
#   Always tie technical decisions back to business impact and customer trust.
#
# Per-mode object (global + overrides):
# custom_instructions:
#   global: >
#     Targeting infra/platform roles. Audience is senior engineers and EMs.
#     Prefer precision over broad claims — "reduced P99 latency" over "improved performance".
#   interview-qa: >
#     Weight cross-team influence and technical leadership stories more heavily.
#     For behavioural questions, surface the reasoning behind architectural choices,
#     not just what was built.
#   portfolio-bullet: >
#     Lead with business-impact metrics where inferable.
#     Preferred format: "Reduced X by Y, enabling Z" — not just action verbs.
#   technical-deep-dive: >
#     Write for a principal-level engineering audience.
#     Include trade-off reasoning explicitly — why the chosen approach beats the
#     alternatives, and what you'd do differently with more time.

# Output connector — where generated artifacts are delivered:
#   local (default): writes ~/.career-mode/artifacts/<file>.md and updates index.yml
#   gist:            also pushes each artifact to a GitHub Gist (returns the URL);
#                    still writes locally so index.yml and `share` keep working
# connector: local
#
# Gist settings (only used when connector: gist, or with `career-mode share`):
# gist_token: ghp_...                   # or set GITHUB_TOKEN env var (needs `gist` scope)
# gist_public: false                    # default false → secret gist

# Notion settings (connector: notion):
# Run `npx tsx scripts/notion-setup.ts <parent-page-id>` to create the database.
notion_token: ${NOTION_TOKEN}
notion_database_id: ${NOTION_DATABASE_ID}
# Optional column mapping if your DB uses different property names:
# notion_property_map:
#   Title: "Story"
#   Mode: "Type"
#   One-liner: "Summary"
